/* Invite pages (v07): corpuscallosum.studio/l/CODE (a laugh) and /s/CODE (a squad invite).

.invite { max-width: 560px; margin: 0 auto; padding: 28px 0 56px; display: grid; gap: 18px; }
.invite h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 7vw, 40px); line-height: 1.1; margin: 0; }
.face { width: 220px; height: 220px; border-radius: 28px; overflow: hidden; border: 6px solid var(--joy); margin: 4px auto 0; background: #F4ECE2; display: grid; place-items: center; font-size: 96px; }
.face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mood { display: inline-block; padding: 4px 14px; border-radius: 999px; font-weight: 800; color: #fff; font-size: 15px; justify-self: center; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 12px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--grape); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 15px; }
.code { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: 0.18em; text-align: center; padding: 10px; border: 2px dashed var(--grape); border-radius: 16px; color: var(--ink); user-select: all; }
.where { font-size: 14px; color: var(--sub); text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { cursor: pointer; background: none; font-family: inherit; }
.muted { color: var(--sub); }
.center { text-align: center; }
.hidden { display: none !important; }

// ---- Language: the phone's, else English ----
const LANG = (() => {
  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const k = String(l).slice(0, 2).toLowerCase();
    if (I18N.words[k]) return k;
  }
  return 'en';
})();
document.documentElement.lang = LANG;
const W = I18N.words[LANG];
const t = (k, v = {}) => (W[k] || I18N.words.en[k] || k).replace(/\{(\w+)\}/g, (_, n) => (v[n] ?? ''));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = document.getElementById('app');
document.getElementById('loading').textContent = t('loading');

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

function stores() {
  const btns = [];
  if (APP_STORE_URL) btns.push(`<a class="btn solid" href="${APP_STORE_URL}"> App Store</a>`);
  if (PLAY_URL) btns.push(`<a class="btn solid" href="${PLAY_URL}">▶ Google Play</a>`);
  return btns.length ? `<div class="row">${btns.join('')}</div>` : `<p class="muted">${esc(t('soon'))}</p>`;
}

function steps(kind, code) {
  return `<div class="card">
    <div class="step"><span class="num">1</span><div><strong>${esc(t('step1'))}</strong>${stores()}</div></div>
    <div class="step"><span class="num">2</span><div>${esc(t('step2'))}</div></div>
    <div class="code" id="code">${esc(code)}</div>
    <p class="where">${esc(kind === 'l' ? t('whereLaugh') : t('whereSquad'))}</p>
    <div class="row">
      <button class="btn" id="copy" type="button">📋 ${esc(t('copy'))}</button>
      <a class="btn" href="hellofaces://${kind}/${esc(code)}">📱 ${esc(t('openApp'))}</a>
    </div>
  </div>
  <p class="where">🛡️ ${esc(t('safety'))}</p>
  <p class="center"><a href="/hello-faces/">${esc(t('what'))}</a></p>`;
}

function wireCopy(code) {
  const b = document.getElementById('copy');
  if (!b) return;
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); b.textContent = '✅ ' + t('copied'); } catch (e) {}
  });
}

function photoUrl(path) {
  return path ? `${SUPABASE_URL}/storage/v1/object/public/faces/${encodeURI(path)}` : '';
}

async function showLaugh(code) {
  let d = null;
  try { d = await rpc('laugh_peek', { p_code: code }); } catch (e) { return message(t('offline')); }
  if (!d) return message(t('notFound'));
  const mood = I18N.moods[LANG][d.emotion] || I18N.moods.en[d.emotion] || d.emotion;
  const color = MOOD_COLOR[d.emotion] || '#7B4DFF';
  const f = d.face;
  const img = f && f.photo_path ? `<img src="${photoUrl(f.photo_path)}" alt="${esc(f.name)}">` : esc((f && f.emoji) || MOOD_EMOJI[d.emotion] || '😂');
  const name = d.sender ? d.sender : t('someone');
  const s = d.stats || {};
  let note = '';
  if (d.status === 'expired') note = `<div class="note"><p>${esc(t('expired'))}</p></div>`;
  else if (d.status !== 'waiting') note = `<div class="note"><p>${esc(t('taken'))}</p></div>`;
  document.title = `Hello Faces · ${name}`;
  app.innerHTML = `
    <div class="face" style="border-color:${color}">${img}</div>
    ${f && f.name ? `<p class="center" style="margin:0"><strong>“${esc(f.name)}”</strong></p>` : ''}
    <span class="mood" style="background:${color}">${esc(mood)}</span>
    <h1 class="center">${esc(t('laughTitle', { name }))}</h1>
    ${note || `<p class="lead center">${esc(t('laughBody', { mood }))}</p>`}
    ${s.people > 1 ? `<p class="center muted">${esc(t((s.countries || 0) <= 1 ? 'reach1' : 'reach', { p: s.people, c: s.countries }))}</p>` : ''}
    ${note ? '' : steps('l', code)}`;
  wireCopy(code);
}

async function showSquad(code) {
  let d = null;
  try { d = await rpc('squad_peek', { p_code: code }); } catch (e) { return message(t('offline')); }
  if (!d) return message(t('notFound'));
  document.title = `Hello Faces · ${d.name}`;
  app.innerHTML = `
    <div class="face" style="border-color:var(--grape)">🤝</div>
    <h1 class="center">${esc(t('squadTitle', { name: d.name }))}</h1>
    <p class="lead center">${esc(t('squadBody'))}</p>
    <p class="center"><strong>${esc(d.full ? t('full') : t('seats', { n: d.members }))}</strong></p>
    ${d.full ? '' : steps('s', code)}`;
  wireCopy(code);
}

function message(text) {
  app.innerHTML = `<div class="face" style="border-color:var(--line)">🙈</div><p class="lead center">${esc(text)}</p><p class="center"><a href="/hello-faces/">${esc(t('what'))}</a></p>`;
}

const m = location.pathname.match(/^\/(l|1|L|s|S)\/([A-Za-z0-9]{6})\/?$/i);
if (m) {
  const code = m[2].toUpperCase();
  (/^[l1]$/i.test(m[1]) ? showLaugh(code) : showSquad(code));
} else {
  app.innerHTML = `<div class="face" style="border-color:var(--line)">🙈</div><h1 class="center">${esc(t('pageGone'))}</h1><p class="center"><a href="/">${esc(t('home'))}</a></p>`;
}
</script>
</body>
</html>
